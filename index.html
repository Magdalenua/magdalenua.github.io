<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magdalenua</title>
  <meta name="description" content="Portafolio de Magdalenua: proyectos y contacto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="work stagePerspective">
    <ul class="projects">
      <li class="projectsLi"><div class="projectContainer"><a href="https://github.com/Magdalenua"><span class="year">2026</span>Proyecto Uno</a></div></li>
      <li class="projectsLi"><div class="projectContainer"><a href="https://github.com/Magdalenua"><span class="year">2026</span>Proyecto Dos</a></div></li>
      <li class="projectsLi"><div class="projectContainer"><a href="https://github.com/Magdalenua"><span class="year">2025</span>Proyecto Tres</a></div></li>
      <li class="projectsLi"><div class="projectContainer"><a href="https://github.com/Magdalenua"><span class="year">2025</span>Proyecto Cuatro</a></div></li>
      <li class="projectsLi"><div class="projectContainer"><a href="https://github.com/Magdalenua"><span class="year">2024</span>Proyecto Cinco</a></div></li>
      <li class="projectsLi"><div class="projectContainer"><a href="https://github.com/Magdalenua"><span class="year">2024</span>skills</a></div></li>
    </ul>
  </main>

  <footer class="info">
    <h1 class="brand">Magda&shy;lenua</h1>
    <div class="cols">
      <p>Ingeniero mecatronico<br>México</p>
      <p><a href="mailto:salvadoracosta010101@gmail.com">salvadoracosta010101@gmail.com</a></p>
      <ol class="links">
        <li><a href="#">sobre mí</a></li>
        <li><a href="https://github.com/Magdalenua">github</a></li>
        <li><a href="#">linkedin</a></li>
      </ol>
    </div>
    <p class="copy">&copy; 2026 Magdalenua.</p>
  </footer>

  <script>
    // Primer clic: el proyecto gira hasta quedar de frente (isSelected).
    // Segundo clic sobre el proyecto ya seleccionado: abre el enlace.
    const items = document.querySelectorAll('.projectsLi');
    items.forEach((li) => {
      li.addEventListener('click', (e) => {
        if (li.classList.contains('isSelected')) return;
        e.preventDefault();
        items.forEach((other) => other.classList.remove('isSelected'));
        li.classList.add('isSelected');
      });
    });
    // Clic fuera de la lista: se deselecciona todo.
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.projectsLi')) {
        items.forEach((li) => li.classList.remove('isSelected'));
      }
    });
  </script>
</body>
</html>
